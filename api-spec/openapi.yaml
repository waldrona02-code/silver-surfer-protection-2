openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: security
    description: Security threat detection and monitoring
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /security/threats:
    get:
      operationId: getThreats
      tags: [security]
      summary: Get recent threats
      description: Returns the most recent threat log entries
      responses:
        "200":
          description: List of detected threats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatsResponse"

  /security/threats/stats:
    get:
      operationId: getThreatStats
      tags: [security]
      summary: Get threat statistics
      description: Returns aggregate counts by type and severity
      responses:
        "200":
          description: Threat statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreatStats"

  /security/scan:
    post:
      operationId: scanPayload
      tags: [security]
      summary: Scan a payload for threats
      description: Scan any text payload against all OWASP threat patterns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ThreatEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
        ip:
          type: string
        method:
          type: string
        path:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        threats:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              severity:
                type: string
              detail:
                type: string
        sources:
          type: array
          items:
            type: string
        userAgent:
          type: string
        blocked:
          type: boolean
      required:
        - id
        - timestamp
        - ip
        - method
        - path
        - severity
        - threats
        - sources
        - userAgent
        - blocked

    ThreatsResponse:
      type: object
      properties:
        threats:
          type: array
          items:
            $ref: "#/components/schemas/ThreatEntry"
      required:
        - threats

    ThreatStats:
      type: object
      properties:
        total:
          type: integer
        blocked:
          type: integer
        byType:
          type: object
          additionalProperties:
            type: integer
        bySeverity:
          type: object
          additionalProperties:
            type: integer
      required:
        - total
        - blocked
        - byType
        - bySeverity

    ScanRequest:
      type: object
      properties:
        payload:
          type: string
      required:
        - payload

    ScanThreat:
      type: object
      properties:
        category:
          type: string
        detected:
          type: boolean
        matches:
          type: array
          items:
            type: string
      required:
        - category
        - detected
        - matches

    ScanResult:
      type: object
      properties:
        payload:
          type: string
        safe:
          type: boolean
        threats:
          type: array
          items:
            $ref: "#/components/schemas/ScanThreat"
        scanned_at:
          type: string
      required:
        - payload
        - safe
        - threats
        - scanned_at

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
